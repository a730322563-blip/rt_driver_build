name: Build Android Kernel Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl build-essential libssl-dev libelf-dev bison flex python3 clang lld llvm bc
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Download Kernel Source
      run: |
        mkdir kernel-src && cd kernel-src
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6
        repo sync -c -j8 -q
        cd ..

    - name: Configure Kernel
      run: |
        cd kernel-src/common
        make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig
        make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules_prepare -j8

    - name- name: Build Module
  run: |
    make -C kernel-src/common M=$GITHUB_WORKSPACE ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 KBUILD_MODPOST_WARN=1 modules -j8

    - name: Upload Module
      uses: actions/upload-artifact@v4
      with:
        name: rt_driver.ko
        path: rt_driver.ko
