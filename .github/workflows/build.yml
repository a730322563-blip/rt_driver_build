name: Build pte_track.ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev \
            python3 clang llvm lld git ccache

      - name: Download Android Common Kernel (android15-6.6)
        run: |
          git clone --depth 1 -b android15-6.6 \
            https://android.googlesource.com/kernel/common kernel-src
          du -sh kernel-src

      - name: Configure GKI
        run: |
          cd kernel-src
          make ARCH=arm64 gki_defconfig

      - name: Build pte_track.ko
        run: |
          cd pte_track_fixed
          make KDIR=../kernel-src LLVM=1 LLVM_IAS=1 ARCH=arm64
          ls -l pte_track.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pte_track-ko
          path: pte_track_fixed/pte_track.ko
